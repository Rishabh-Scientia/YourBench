  <!-- Logo Text -->
  <g transform="translate(0, -10)">
    <text x="260" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="95" fill="#0E8522" text-anchor="middle">Your</text>
    <text x="240" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="110" fill="#0A0A0A" text-anchor="middle">Bench</text>
  </g>
  
  <!-- Green Diagonal Section at the bottom -->
