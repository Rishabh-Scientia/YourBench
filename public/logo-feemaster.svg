<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White background -->
  <rect width="500" height="500" fill="#FFFFFF"/>
  
  <!-- Document Icon (Top Center) -->
  <g transform="translate(210, 80)" fill="none" stroke="#0B2F64" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0,0 L 50,0 L 80,30 L 80,80 C 80,85 75,90 70,90 L 0,90 C -5,90 -10,85 -10,80 L -10,10 C -10,5 -5,0 0,0 Z" />
    <path d="M 50,0 L 50,30 L 80,30" fill="none" stroke="#0B2F64" stroke-width="8"/>
    <!-- Rupee symbol in green -->
    <text x="15" y="55" font-family="system-ui, sans-serif" font-weight="bold" font-size="44" fill="#1A8A1A" stroke="none">₹</text>
    <!-- Line next to Rupee -->
    <line x1="20" y1="72" x2="60" y2="72" stroke="#0B2F64" stroke-width="6"/>
  </g>

  <!-- Large "FM" (Center) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" letter-spacing="-5">
    <text x="145" y="300" fill="#0B2F64">F</text>
    <text x="215" y="300" fill="#1A8A1A">M</text>
  </g>

  <!-- Circular Checkmark (Bottom Right of M) -->
  <g transform="translate(295, 250)">
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" stroke="#0B2F64" stroke-width="8" />
    <path d="M 18,30 L 26,38 L 42,20" fill="none" stroke="#1A8A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- "FeeMaster" Text (Bottom Center) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="64" text-anchor="middle">
    <text x="250" y="415">
      <tspan fill="#0B2F64">Fee</tspan>
      <tspan fill="#1A8A1A">Master</tspan>
    </text>
  </g>
</svg>
